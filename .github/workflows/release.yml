name: Release

# Publishes to PyPI via OIDC trusted publishing. No long-lived API token is
# stored in this repository or in GitHub secrets.
#
# One-time setup on PyPI (https://pypi.org/manage/account/publishing/):
#   PyPI Project Name : phocinae-cli
#   Owner             : Phocinae
#   Repository name   : phocinae-cli
#   Workflow name     : release.yml
#   Environment name  : pypi
# After that, pushing a tag like `v0.1.1` publishes automatically.
#
# `workflow_dispatch` re-runs a release without a new tag. A tag push runs the
# workflow file AT THE TAGGED COMMIT, so a fix committed after the tag would
# never run under that tag; dispatching on the branch checks out the fixed tree.

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      # Never publish an artifact that has not passed the smoke suite: this is
      # the gate that stops a broken release from reaching PyPI.
      - name: Smoke test
        run: python tests/smoke.py

      - name: Build
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/phocinae-cli
    permissions:
      id-token: write # required for OIDC trusted publishing
    steps:

      # Fail fast, and say what to do. The OIDC exchange is the one step whose failure
      # the committer cannot see in the diff, and finding out after a full build wastes
      # minutes and prints a wall of JWT claims instead of an instruction. PyPI has no
      # API for configuring a trusted publisher (its settings page answers 403 to a
      # token), so the only fix is a human on that page — this step names it.
      # 发布前打开将要上传的那个 wheel 看一眼。源码树里的测试**看不到打包缺陷** ——
      # mcp 0.2.2 少带 L0 表、cli 0.1.1 带的是手抄的旧表，两者在源码树里都是绿的。
      # 这一步读取 wheel 内容（含 METADATA 的版本），不联网、不装依赖。
      - name: Inspect the built wheel before publishing
        run: python tools/verify_wheel_contents.py "dist/*.whl" --expect-name phocinae-cli --expect-version "${{ github.ref_name }}"

      - name: Preflight the PyPI credential
        id: preflight
        env:
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          if [ -n "${PYPI_API_TOKEN}" ]; then
            echo "PYPI_API_TOKEN secret present; publishing with the token."
            echo "use_token=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "No PYPI_API_TOKEN secret; using OIDC trusted publishing."

          AUDIENCE="$(curl -fsS --max-time 30 https://pypi.org/_/oidc/audience \
            | python -c 'import json,sys; print(json.load(sys.stdin)["audience"])')"
          echo "PyPI OIDC audience: ${AUDIENCE}"
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "::error::'id-token: write' is missing from this job's permissions."
            exit 1
          fi
          CODE="$(curl -sS -o /tmp/oidc.json -w '%{http_code}' --max-time 30 \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${AUDIENCE}")"
          if [ "${CODE}" != "200" ]; then
            echo "::error::Could not mint a GitHub OIDC token (HTTP ${CODE})."
            cat /tmp/oidc.json || true
            exit 1
          fi
          echo "GitHub OIDC token minted OK."
          echo "If the upload step reports 'invalid-publisher', trusted publishing is"
          echo "not configured for this project. It has to be set once on the web —"
          echo "there is no API for it:"
          echo "  https://pypi.org/manage/project/phocinae-cli/settings/publishing/"
          echo "    PyPI Project Name : phocinae-cli"
          echo "    Owner             : Phocinae"
          echo "    Repository name   : phocinae-cli"
          echo "    Workflow filename : release.yml"
          echo "    Environment name  : pypi"
          echo "Or set a repository secret named PYPI_API_TOKEN to publish with a token."

      - name: Publish to PyPI (OIDC)
        if: ${{ steps.preflight.outputs.use_token != 'true' }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # A version that already exists makes PyPI answer 400; that means the
          # release is done, not that the job should go red.
          skip-existing: true


      - name: Publish to PyPI (API token)
        # Only used when a PYPI_API_TOKEN secret exists;
        # the default path stays the keyless OIDC exchange.
        if: ${{ steps.preflight.outputs.use_token == 'true' }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          # A version that already exists makes PyPI answer 400; that means the
          # release is done, not that the job should go red.
          skip-existing: true

  release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            REF_NAME="${GITHUB_REF_NAME}"
          else
            REF_NAME="v$(python -c "import re,pathlib;print(re.search(r'version = \"([^\"]+)\"', pathlib.Path('pyproject.toml').read_text()).group(1))")"
          fi
          if gh release view "${REF_NAME}" >/dev/null 2>&1; then
            echo "release ${REF_NAME} already exists; skipping"
            exit 0
          fi
          gh release create "${REF_NAME}" --title "${REF_NAME}" --generate-notes
