name: CI

on:
  push:
    branches: ['**']
    tags-ignore: ['v*']
  pull_request:
  workflow_dispatch:

env:
  # 非 UTF-8 控制台（windows runner 是 cp1252/437）下，打印非 ASCII 会抛
  # UnicodeEncodeError 把 job 拖红。脚本自身已 reconfigure 兜底，
  # 这里覆盖 pip/build 与子进程的输出。
  PYTHONUTF8: '1'

jobs:
  test:
    name: test (python ${{ matrix.python }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      # The CLI carries its own L0 table and matcher, generated from
      # phocinae-guard. It used to be a hand copy of guard 0.1.0, and when guard
      # fixed ten reproducible bypasses in 0.1.3 this copy did not follow — so
      # `ls\nrm -rf /` was denied by guard and ALLOWED by the CLI. Two packages
      # giving opposite verdicts for the same command is worse than one package
      # missing a feature, because the user believes they have the same gate.
      #
      # This checks the two implementations verdict-by-verdict over a shared
      # corpus including every bypass sample. It needs guard present, so guard is
      # cloned beside the checkout; without it the test SKIPs rather than passing.
      - name: Checkout phocinae-guard (for the L0 parity check)
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: Phocinae/phocinae-guard
          path: .guard-for-parity

      - name: L0 parity with phocinae-guard
        # 必须显式指定 bash：这一步用的是 POSIX 的 `if [ ... ]; then ... fi` 与
        # `"$PWD/..."`，而 GitHub Actions 在 Windows runner 上默认拿 PowerShell 跑
        # `run:`。之前没有这一行，于是 windows 上脚本第一行就 ParserError，
        # "guard 缺失就跳过"的兜底都没机会执行，windows job 直接红灯。
        shell: bash
        run: |
          if [ ! -f .guard-for-parity/guard.py ]; then
            echo "::warning::phocinae-guard checkout failed; L0 parity not verified"
            exit 0
          fi
          PHOCINAE_GUARD_PY="$PWD/.guard-for-parity/guard.py" python tests/test_l0_parity.py

      # 跨平台冒烟驱动：自起 mock server，覆盖 6 个子命令、管道/批量、
      # 错误分类与 gate 的 0/1/2/3 退出码契约。
      - name: Smoke test
        run: python tests/smoke.py

      - name: Single-file zero-dependency build check
        run: python -c "import ast; ast.parse(open('phocinae.py', encoding='utf-8').read()); print('phocinae.py parses OK')"

      - name: Build sdist and wheel
        run: |
          python -m pip install build
          python -m build

  # 冒烟驱动以 `python -m phocinae_cli` 调用（不依赖 console script 是否在 PATH）。
  # 这个 job 额外证明「装完之后 phocinae 命令真的能用」，以及退出码语义。
  console-script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install and exercise the console script
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
          phocinae --version
          # deny 必须给出 2；allow 必须给出 0
          if phocinae gate --command "rm -rf /"; then
            echo "expected a non-zero exit for a denied command"; exit 1
          else
            test $? -eq 2
          fi
          phocinae gate --command "git status"
